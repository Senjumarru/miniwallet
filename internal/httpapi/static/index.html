<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MiniWallet</title>
<style>
  :root {
    --bg: #0f1420; --card: #1a2233; --card2: #212c42; --line: #2c3a57;
    --text: #e8edf7; --muted: #8fa0bd; --accent: #4f8cff; --ok: #34c98e; --err: #ff6b6b;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg); color: var(--text);
    font-family: "Segoe UI", system-ui, sans-serif;
    min-height: 100vh; padding: 24px;
  }
  .wrap { max-width: 960px; margin: 0 auto; }
  header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; }
  h1 { font-size: 22px; }
  h1 span { color: var(--accent); }
  .health { font-size: 13px; color: var(--muted); display: flex; align-items: center; gap: 6px; }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: #666; }
  .dot.on { background: var(--ok); }
  .dot.off { background: var(--err); }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .card {
    background: var(--card); border: 1px solid var(--line);
    border-radius: 12px; padding: 18px;
  }
  .card h2 { font-size: 15px; margin-bottom: 12px; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: .04em; }
  label { display: block; font-size: 13px; color: var(--muted); margin: 10px 0 4px; }
  input {
    width: 100%; padding: 9px 11px; border-radius: 8px;
    border: 1px solid var(--line); background: var(--card2);
    color: var(--text); font-size: 14px; outline: none;
  }
  input:focus { border-color: var(--accent); }
  button {
    margin-top: 12px; width: 100%; padding: 10px;
    border: none; border-radius: 8px; background: var(--accent);
    color: #fff; font-size: 14px; font-weight: 600; cursor: pointer;
  }
  button:hover { filter: brightness(1.1); }
  button.ghost { background: var(--card2); border: 1px solid var(--line); color: var(--text); }
  .msg { margin-top: 10px; font-size: 13px; min-height: 18px; white-space: pre-wrap; }
  .msg.ok { color: var(--ok); }
  .msg.err { color: var(--err); }
  .balance { font-size: 30px; font-weight: 700; margin: 4px 0 2px; }
  .balance small { font-size: 14px; color: var(--muted); font-weight: 400; }
  .who { font-size: 13px; color: var(--muted); margin-bottom: 10px; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: left; padding: 7px 8px; border-bottom: 1px solid var(--line); }
  th { color: var(--muted); font-weight: 600; }
  td.num { text-align: right; font-variant-numeric: tabular-nums; }
  .in { color: var(--ok); } .out { color: var(--err); }
  .full { grid-column: 1 / -1; }
  .hint { font-size: 12px; color: var(--muted); margin-top: 8px; }
  .badge { display: inline-block; padding: 1px 8px; border-radius: 10px; font-size: 11px; background: var(--card2); border: 1px solid var(--line); }
  .hidden { display: none; }
  #logout { width: auto; padding: 6px 14px; margin: 0; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Mini<span>Wallet</span></h1>
    <div class="health"><span class="dot" id="dot"></span><span id="healthText">проверка...</span></div>
  </header>

  <!-- ===== Гость: регистрация и вход ===== -->
  <div id="guest" class="grid">
    <div class="card">
      <h2>Регистрация</h2>
      <label>Email</label><input id="regEmail" type="email" placeholder="alice@example.kz">
      <label>Пароль (мин. 8 символов)</label><input id="regPass" type="password" placeholder="password123">
      <button onclick="register()">Создать аккаунт</button>
      <div class="msg" id="regMsg"></div>
    </div>
    <div class="card">
      <h2>Вход</h2>
      <label>Email</label><input id="logEmail" type="email" placeholder="alice@example.kz">
      <label>Пароль</label><input id="logPass" type="password" placeholder="password123">
      <button onclick="login()">Войти</button>
      <div class="msg" id="logMsg"></div>
    </div>
  </div>

  <!-- ===== Пользователь: кошелёк ===== -->
  <div id="app" class="grid hidden">
    <div class="card">
      <h2>Баланс</h2>
      <div class="who" id="who"></div>
      <div class="balance"><span id="balance">0</span> <small id="currency">KZT</small></div>
      <div class="hint">Деньги хранятся в тиынах: 1000,50 ₸ = 100050</div>
      <button class="ghost" onclick="refreshBalance()">Обновить баланс</button>
      <div style="text-align:right;margin-top:-34px"><button id="logout" class="ghost" onclick="logout()">Выйти</button></div>
    </div>
    <div class="card">
      <h2>Пополнить</h2>
      <label>Сумма в тиынах (целое число &gt; 0)</label>
      <input id="depAmount" type="number" min="1" step="1" placeholder="100050">
      <button onclick="deposit()">Пополнить</button>
      <div class="msg" id="depMsg"></div>
    </div>
    <div class="card">
      <h2>Перевести</h2>
      <label>Email получателя</label><input id="trTo" type="email" placeholder="bob@example.kz">
      <label>Сумма в тиынах</label><input id="trAmount" type="number" min="1" step="1" placeholder="300">
      <button onclick="transfer()">Перевести</button>
      <div class="msg" id="trMsg"></div>
      <div class="hint">Idempotency-Key генерируется автоматически: повтор кнопки не задвоит перевод</div>
    </div>
    <div class="card full">
      <h2>История операций</h2>
      <table>
        <thead><tr><th>#</th><th>Тип</th><th>Отправитель</th><th>Получатель</th><th style="text-align:right">Сумма, тиыны</th><th>Время</th></tr></thead>
        <tbody id="txBody"><tr><td colspan="6" style="color:var(--muted)">Пока пусто</td></tr></tbody>
      </table>
      <button class="ghost" onclick="loadHistory()">Обновить историю</button>
    </div>
  </div>
</div>

<script>
const API = '';
const $ = id => document.getElementById(id);

// ---- токен: держим в localStorage, чтобы перезагрузка страницы не разлогинивала
let TOKEN = localStorage.getItem('mw_token') || '';
let MY_EMAIL = localStorage.getItem('mw_email') || '';

// ---- утилиты
async function api(path, opts = {}) {
  const headers = { 'Content-Type': 'application/json', ...(opts.headers || {}) };
  if (TOKEN) headers['Authorization'] = 'Bearer ' + TOKEN;
  const res = await fetch(API + path, { ...opts, headers });
  let body = null;
  try { body = await res.json(); } catch (_) {}
  if (!res.ok) {
    const msg = body && body.error ? `${body.error.code}: ${body.error.message}` : ('HTTP ' + res.status);
    throw new Error(msg);
  }
  return body;
}
function show(id, text, ok) {
  const el = $(id);
  el.textContent = text;
  el.className = 'msg ' + (ok ? 'ok' : 'err');
}

// ---- health
async function checkHealth() {
  try {
    await api('/health');
    $('dot').className = 'dot on';
    $('healthText').textContent = 'сервис работает';
  } catch (_) {
    $('dot').className = 'dot off';
    $('healthText').textContent = 'сервис недоступен';
  }
}

// ---- регистрация
async function register() {
  try {
    const data = await api('/auth/register', {
      method: 'POST',
      body: JSON.stringify({ email: $('regEmail').value.trim(), password: $('regPass').value })
    });
    show('regMsg', `Аккаунт создан (id=${data.id}). Теперь войдите.`, true);
  } catch (e) { show('regMsg', e.message, false); }
}

// ---- вход
async function login() {
  try {
    const data = await api('/auth/login', {
      method: 'POST',
      body: JSON.stringify({ email: $('logEmail').value.trim(), password: $('logPass').value })
    });
    TOKEN = data.token;
    MY_EMAIL = $('logEmail').value.trim();
    localStorage.setItem('mw_token', TOKEN);
    localStorage.setItem('mw_email', MY_EMAIL);
    show('logMsg', 'Вход выполнен', true);
    enterApp();
  } catch (e) { show('logMsg', e.message, false); }
}

function logout() {
  TOKEN = ''; MY_EMAIL = '';
  localStorage.removeItem('mw_token');
  localStorage.removeItem('mw_email');
  location.reload();
}

// ---- переключение гость/кошелёк
function enterApp() {
  $('guest').classList.add('hidden');
  $('app').classList.remove('hidden');
  $('who').textContent = 'Вы вошли как ' + MY_EMAIL;
  refreshBalance();
  loadHistory();
}

// ---- баланс
async function refreshBalance() {
  try {
    const acc = await api('/accounts/me');
    $('balance').textContent = acc.balance_minor.toLocaleString('ru-RU');
    $('currency').textContent = acc.currency;
  } catch (e) { if (String(e.message).includes('unauthorized')) logout(); }
}

// ---- депозит
async function deposit() {
  try {
    const data = await api('/accounts/deposit', {
      method: 'POST',
      body: JSON.stringify({ amount: Number($('depAmount').value) })
    });
    show('depMsg', `Пополнение +${data.amount_minor} → баланс ${data.balance_minor}`, true);
    refreshBalance(); loadHistory();
  } catch (e) { show('depMsg', e.message, false); }
}

// ---- перевод
async function transfer() {
  try {
    const key = 'web-' + crypto.randomUUID(); // идемпотентность на каждую операцию своя
    const data = await api('/transfers', {
      method: 'POST',
      headers: { 'Idempotency-Key': key },
      body: JSON.stringify({ to_email: $('trTo').value.trim(), amount: Number($('trAmount').value) })
    });
    show('trMsg', `Перевод #${data.transaction_id} на ${data.amount_minor} → баланс ${data.balance_after_minor}`, true);
    refreshBalance(); loadHistory();
  } catch (e) { show('trMsg', e.message, false); }
}

// ---- история
async function loadHistory() {
  try {
    const page = await api('/transactions?limit=20&offset=0');
    const tb = $('txBody');
    if (!page.items.length) {
      tb.innerHTML = '<tr><td colspan="6" style="color:var(--muted)">Пока пусто</td></tr>';
      return;
    }
    tb.innerHTML = page.items.map(t => {
      const out = t.from_account_id !== null; // исходящая — если мы отправитель
      const cls = t.type === 'deposit' ? 'in' : (out ? 'out' : 'in');
      const sign = t.type === 'deposit' ? '+' : (out ? '−' : '+');
      return `<tr>
        <td>${t.id}</td>
        <td><span class="badge">${t.type}</span></td>
        <td>${t.from_account_id ?? '—'}</td>
        <td>${t.to_account_id ?? '—'}</td>
        <td class="num ${cls}">${sign}${t.amount_minor.toLocaleString('ru-RU')}</td>
        <td>${new Date(t.created_at).toLocaleString('ru-RU')}</td>
      </tr>`;
    }).join('');
  } catch (e) { console.error(e); }
}

// ---- старт
checkHealth();
if (TOKEN) enterApp();
</script>
</body>
</html>
